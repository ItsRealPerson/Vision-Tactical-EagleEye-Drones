plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_version"
    modImplementation "com.terraformersmc:modmenu:$rootProject.mod_menu_version"
    modApi "me.shedaniel.cloth:cloth-config-fabric:$rootProject.cloth_config_version"
    modImplementation "io.wispforest:accessories-fabric:$rootProject.accessories_version"

    // GeckoLib 4
    modImplementation "software.bernie.geckolib:geckolib-fabric-${rootProject.minecraft_version}:${rootProject.geckolib_version}"

    // Vision Goggles 2.0.0 Fabric
    modImplementation "dev.itsrealperson:vision-goggles-fabric:${rootProject.vision_goggles_version}"

    // JEI Fabric API (Compile only)
    modCompileOnly "mezz.jei:jei-${rootProject.minecraft_version}-fabric-api:${rootProject.jei_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    shadowBundle(project(path: ":common", configuration: "transformProductionFabric")) { transitive = false }
}

shadowJar {
    exclude "META-INF/services/**"
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'

    relocate 'org.luaj', 'dev.itsrealperson.vision_goggles.shadow.org.luaj'
}

remapJar {
    input.set shadowJar.archiveFile
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
